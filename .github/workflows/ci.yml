name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017

      redis:
        image: redis:7
        ports:
          - 6379:6379

      rabbitmq:
        image: rabbitmq:3
        ports:
          - 5672:5672

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - run: npm ci
    
    - name: Run ESLint
      run: npx eslint src/**/*.ts

    - name: Run TypeScript Compile Check
      run: npx tsc --noEmit
      
    - name: Run Security Audits
      run: npm audit --audit-level=high

    - name: Run Integration Tests
      run: npm test
      env:
        NODE_ENV: test
        JWT_SECRET: super_secret_test_key_minimum_length
        POSTGRES_HOST: localhost
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: secret
        POSTGRES_DB: test_db
        MONGO_URI: mongodb://localhost:27017/test_db
        REDIS_URL: redis://localhost:6379
        RABBITMQ_URL: amqp://localhost
